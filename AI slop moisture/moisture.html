<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Moisture Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h2>Plant Moisture Dashboard</h2>
        <button id="theme-toggle" class="theme-toggle">Light Mode</button>
    </header>
    <div class="container">
        <h1>Houseplant Moisture Status</h1>

        <div style="margin-bottom:1rem; text-align:center;">
            <button id="add-plant" class="theme-toggle">Add Plant</button>
            <button id="remove-plant" class="theme-toggle">Remove Plant</button>
        </div>
        <!-- Modal for adding plant -->
        <div id="plant-modal"
            style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
            <div
                style="background:#23272a; padding:2rem; border-radius:8px; min-width:300px; max-width:90vw; margin:auto; box-shadow:0 2px 16px rgba(0,0,0,0.3);">
                <h2 style="margin-top:0; color:#b6f7b0;">Add New Plant</h2>
                <label for="plant-name-input" style="display:block; margin-bottom:0.5rem;">Plant Name:</label>
                <input id="plant-name-input" type="text"
                    style="width:100%; padding:0.5rem; margin-bottom:1rem; border-radius:4px; border:1px solid #333c33;">
                <label for="moisture-input" style="display:block; margin-bottom:0.5rem;">Moisture Level (0-100):</label>
                <input id="moisture-input" type="number" min="0" max="100" value="50"
                    style="width:100%; padding:0.5rem; margin-bottom:1rem; border-radius:4px; border:1px solid #333c33;">
                <div style="text-align:right;">
                    <button id="modal-add-btn" class="theme-toggle" style="margin-right:0.5rem;">Add</button>
                    <button id="modal-cancel-btn" class="theme-toggle">Cancel</button>
                </div>
            </div>
        </div>
    </div>
    <div class="plant-list" id="plant-list">
        <div class="plant-card">
            <div class="plant-name">Aloe Vera</div>
            <div class="moisture-status"></div>
            <div class="moisture-bar">
                <div class="moisture-bar-inner" data-width="55"></div>
            </div>
        </div>
        <div class="plant-card">
            <div class="plant-name">Peace Lily</div>
            <div class="moisture-status"></div>
            <div class="moisture-bar">
                <div class="moisture-bar-inner" data-width="80"></div>
            </div>
        </div>
        <div class="plant-card">
            <div class="plant-name">Snake Plant</div>
            <div class="moisture-status"></div>
            <div class="moisture-bar">
                <div class="moisture-bar-inner" data-width="30"></div>
            </div>
        </div>
    </div>
    </div>
    <footer>
        &copy; 2025 Plant Moisture Dashboard
    </footer>
    <script src="script.js"></script>
</html>
